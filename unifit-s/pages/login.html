<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><title>로그인 - UniFit-S</title></head><body data-root="../">
<div class="banner"><div class="wrap"><h2>UniFit-S 시작하기</h2><p>회원가입할 때 프로필도 함께 입력해요.</p></div></div>
<div class="wrap" style="max-width:520px;margin-top:20px">
<div class="tabs"><button class="tab on" id="t1">로그인</button><button class="tab" id="t2">회원가입</button></div>
<form class="panel" id="lf"><label>아이디</label><input id="l_id" required><label>비밀번호</label><input id="l_pw" type="password" required><p class="err" id="l_err"></p><br><button class="btn" style="width:100%">로그인</button></form>
<form class="panel" id="sf" style="display:none"><label>아이디</label><input id="s_id" required minlength="3"><label>비밀번호 (4자 이상)</label><input id="s_pw" type="password" required minlength="4"><label>비밀번호 확인</label><input id="s_pw2" type="password" required>
<hr style="margin:18px 0;border:0;border-top:1px solid #e5e7f0"><b>내 프로필</b><div id="pbox"></div><p class="err" id="s_err"></p><br><button class="btn" style="width:100%">가입하고 시작하기</button></form></div>
<script src="../js/data.js"></script><script src="../js/auth.js"></script><script src="../js/layout.js"></script><script>
$('pbox').innerHTML=profileHTML;
const next=new URLSearchParams(location.search).get('next')||'recommend.html';
function tab(a){$('lf').style.display=a?'block':'none';$('sf').style.display=a?'none':'block';$('t1').classList.toggle('on',a);$('t2').classList.toggle('on',!a)}
$('t1').onclick=()=>tab(true);$('t2').onclick=()=>tab(false);
$('lf').onsubmit=e=>{e.preventDefault();const r=login($('l_id').value.trim(),$('l_pw').value);if(r)$('l_err').textContent=r;else location.href=next};
$('sf').onsubmit=e=>{e.preventDefault();if($('s_pw').value!==$('s_pw2').value){$('s_err').textContent='비밀번호가 서로 달라요.';return}
const r=signup($('s_id').value.trim(),$('s_pw').value,readProfile());if(r)$('s_err').textContent=r;else{alert('가입 완료!');location.href=next}};
</script></body></html>
