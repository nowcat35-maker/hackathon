<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><title>공고 상세 - UniFit-S</title></head><body data-root="../">
<div class="wrap" style="margin-top:30px" id="box"></div>
<script src="../js/data.js"></script><script src="../js/auth.js"></script><script src="../js/layout.js"></script><script>
const id=new URLSearchParams(location.search).get('id');const i=ITEMS.find(x=>x.id===id)||ITEMS[0];
function need(){if(me())return true;if(confirm('로그인이 필요해요. 로그인 화면으로 갈까요?'))location.href='login.html?next='+encodeURIComponent('detail.html?id='+i.id);return false}
const ORDER=['wish','prep','done','pass','fail'];
function steps(st){const k=Math.max(0,['wish','prep','done','result'].indexOf(st==='pass'||st==='fail'?'result':st));return `<div class="steps">${['관심','준비 중','지원 완료','결과'].map((t,n)=>`<i class="${n<=k?'on':''}" title="${t}"></i>`).join('')}</div>`}
function render(){
 const st=stageOf(i.id),R=reasons(i),applied=['done','pass','fail'].includes(st);
 const why=R.length?`<div class="panel"><h2>${ico('sparkle',20)} 왜 이 공고를 추천했나요?</h2><ul class="diag">${R.map(r=>`<li class="d-${r.k==='warn'?'bad':r.k==='ok'?'ok':'warn'}"><span>${ico(r.k==='ok'?'check':r.k==='warn'?'xc':'info',18)}</span><div><b>${esc(r.t)}</b></div></li>`).join('')}</ul><p class="fine">내 프로필과 공고 내용을 비교한 근거예요. 점수만 보여 주지 않고 이유를 함께 공개합니다.</p></div>`:'';
 const side=`<div class="panel side"><div class="thumb hasimg"><img src="${ROOT}images/${IMG[i.cat]}.png" alt="" onerror="this.remove()"></div>
 <div style="margin:12px 0">${diagMini(i)}</div>
 <a class="btn dark full" href="${esc(i.url)}" target="_blank" rel="noopener">원문 공고 보기 ${ico('ext',16)}</a>
 ${st?`<div class="mystage"><b>내 진행 단계</b>${steps(st)}<select id="stg" aria-label="진행 단계"><option value="wish">관심</option><option value="prep">준비 중</option><option value="done">지원 완료</option><option value="pass">합격</option><option value="fail">불합격</option><option value="">관리 안 함</option></select><a class="more" href="board.html">지원 현황 보드에서 보기 ${ico('arrow',14)}</a></div>`
 :`<button type="button" class="btn full" id="ap" style="margin-top:8px">${ico('check',17)} 지원했어요 (기록하기)</button><button type="button" class="btn line full" id="bk" style="margin-top:8px">${ico('bookmark',17)} 관심 저장</button>`}
 ${i.end?`<div class="calbtn"><b>${ico('calendar',16)} 마감일 캘린더에 넣기</b><div><button type="button" class="mini" id="ics">${ico('download',13)} .ics 파일</button><a class="mini" target="_blank" rel="noopener" href="${esc(gcalURL(i))}">구글 캘린더 ${ico('ext',12)}</a></div></div>`:''}</div>`;
 box.innerHTML=`<div class="two"><div><span class="badge">${i.cat}</span>${(i.sub||[]).map(s=>`<span class="badge sub">${s}</span>`).join('')}<h1 class="dh">${esc(i.title)}</h1><p style="color:#6b7280">${esc(i.org)} · ${i.end?'마감 '+i.end+' ('+dday(i.end)+')':'상시모집'}</p>
 <div style="height:18px"></div>${why}${diagPanel(i)}
 <div class="panel"><h2>지원 자격</h2><p class="body">지원대상: ${esc(i.target)}<br>학년: ${esc(i.grade)}<br>전공/분야: ${esc(i.field)}<br>지역: ${esc(i.region)}<br>필수조건: ${esc(i.cond)}</p></div>
 <div class="panel"><h2>지원 내용</h2><p class="body">${esc(i.amount)}</p><p class="fine">정보 확인일 ${esc(i.checked)} · 마감 전 원문에서 꼭 다시 확인하세요.</p></div></div>${side}</div>`;
 const g=document.getElementById('stg');if(g){g.value=st;g.onchange=()=>{setStage(i.id,g.value||null);toast(g.value?'진행 단계를 “'+STAGE_T[g.value]+'”으로 바꿨어요':'지원 현황에서 뺐어요');render()}}
 const ap=document.getElementById('ap');if(ap)ap.onclick=()=>{if(!need())return;setStage(i.id,'done');toast('지원 완료로 기록했어요. 실제 지원은 원문 공고에서 해 주세요');render()};
 const bk=document.getElementById('bk');if(bk)bk.onclick=()=>{if(!need())return;setStage(i.id,'wish');toast('관심 공고에 담았어요','지원 현황 보기',()=>{location.href='board.html'});render()};
 const ic=document.getElementById('ics');if(ic)ic.onclick=()=>{downloadICS([i],'unifit-s-'+i.id+'.ics');toast('일정 파일을 내려받았어요')};
}
render();
</script></body></html>
